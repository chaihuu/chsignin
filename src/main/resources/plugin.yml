name: ChSignin
version: 1.1.2
main: xyz.chaihu.chsignin.ChSigninPlugin
api-version: '1.21'
authors: [chaihu]
description: 轻量化签到插件, /qd 命令 + 基岩版表单 UI 双入口, 全聊天栏交互, 兼容 Geyser。
softdepend: [Vault, Geyser, Geyser-Spigot]

commands:
  qd:
    description: 签到 / 补签 / 查询
    usage: "§c用法: /qd help 查看帮助"
    aliases: [qiandao, sign]

permissions:
  chsignin.use:
    description: 使用 /qd 签到功能
    default: true
  chsignin.admin:
    description: 重载配置等管理功能
    default: op
